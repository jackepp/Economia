<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Economia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1f27" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Economia</title>
</head>
<body>
<header>
  <h1><a class="brand" id="brand" href="./" title="Till översikten">
    <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="9" fill="url(#brandGrad)"/>
      <rect x="7.5" y="17" width="4" height="8" rx="1.5" fill="#fff" opacity=".55"/>
      <rect x="14" y="13" width="4" height="12" rx="1.5" fill="#fff" opacity=".75"/>
      <rect x="20.5" y="9" width="4" height="16" rx="1.5" fill="#fff"/>
      <defs><linearGradient id="brandGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#14b8a6"/></linearGradient></defs>
    </svg>
    <span class="brand-name">Econom<span class="brand-accent">ia</span></span></a></h1>
  <!-- På mobil blir flikarna en flikrad längst ner med ikoner och korta namn -->
  <nav id="tabs">
    <button data-view="overview" class="active"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="9" rx="2"/><rect x="13.5" y="3.5" width="7" height="5" rx="2"/><rect x="13.5" y="11.5" width="7" height="9" rx="2"/><rect x="3.5" y="15.5" width="7" height="5" rx="2"/></svg><span class="tl">Översikt</span><span class="ts">Översikt</span></button>
    <button data-view="uncat"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 13.5 6 5.5h12l2.5 8V18a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M3.5 13.5H8l1.2 2.2h5.6l1.2-2.2h4.5"/></svg><span class="tl">Okategoriserat</span><span class="ts">Kategorisera</span><span class="tabcount" id="uncatCount" hidden></span></button>
    <button data-view="trends"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="m3.5 17 5.5-6 4 3.5 7.5-8"/><path d="M15.5 6.5h5v5"/></svg><span class="tl">Trender</span><span class="ts">Trender</span></button>
    <button data-view="list"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6.5h11M9 12h11M9 17.5h11"/><circle cx="4.5" cy="6.5" r="1.2"/><circle cx="4.5" cy="12" r="1.2"/><circle cx="4.5" cy="17.5" r="1.2"/></svg><span class="tl">Transaktioner</span><span class="ts">Lista</span></button>
    <button data-view="settings"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11.5V5a1.5 1.5 0 0 1 1.5-1.5h6.5l9 9-8 8z"/><circle cx="8" cy="8" r="1.6"/></svg><span class="tl">Kategorier &amp; regler</span><span class="ts">Kategorier</span></button>
    <button data-view="import"><svg class="ti" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5V4M7.5 8.5 12 4l4.5 4.5"/><path d="M4 15v3.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V15"/></svg><span class="tl">Importera</span><span class="ts">Importera</span></button>
  </nav>
  <div class="spacer"></div>
  <span id="sync" class="muted" title="Status för synk med databasen"></span>
  <label class="muted"><span class="plabel">Period</span> <select id="period" aria-label="Period"></select></label>
  <button class="btn primary" id="importBtn" aria-label="Importera fil"><span class="ib-full">Importera fil…</span><svg class="ib-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <input type="file" id="fileInput" accept=".csv,.txt,.pdf,.json,text/csv,application/pdf" multiple hidden>
</header>
<main id="main"></main>
<footer id="version" class="muted"></footer>
<div id="globaldrop">Släpp kontoutdraget här</div>
<div id="toast"></div>
<dialog id="editor"></dialog>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
